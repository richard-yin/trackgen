name: CI
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test

  qml-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install qmllint
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends qml6-base-dev
      - name: Lint QML
        run: npm run lint:qml
