name: CI
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test

  qml-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install qmllint
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends qt6-declarative-dev-tools
      - name: Lint QML
        # qmllint exits 0 (clean), 100 (warnings), or 1 (errors).
        # We only fail on exit code 1 (real errors such as parse errors).
        # --import disable silences "module not found" for QtQuick/MuseScore/
        # FileIO; remaining warnings about unknown grouped property scopes are
        # also false positives caused by the same missing types, so we treat
        # exit code 100 as a pass.
        run: |
          /usr/lib/qt6/bin/qmllint --import disable trackgen/trackgen.qml
          RC=$?
          [ $RC -eq 0 ] || [ $RC -eq 100 ] || exit $RC
