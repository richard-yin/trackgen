name: CI
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test

  qml-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install qmllint
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends qt6-declarative-dev-tools
      - name: Lint QML
        # qmllint exits 0 (clean), 100 (warnings only), or 1 (errors).
        # bash -e fires on any non-zero exit, so capture with && / || so the
        # overall expression always succeeds, then fail only on exit code 1.
        # --import disable silences unresolvable QtQuick/MuseScore/FileIO
        # imports; remaining grouped-property warnings are cascading false
        # positives from the same missing types and are also treated as pass.
        run: |
          /usr/lib/qt6/bin/qmllint --import disable trackgen/trackgen.qml \
            && RC=0 || RC=$?
          [ $RC -eq 0 ] || [ $RC -eq 100 ] || exit 1
