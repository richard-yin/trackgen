name: CI
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test

  plugin-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check JS syntax
        # node --check parses each file and exits non-zero on any syntax error.
        # voiceTypes.js uses .pragma library (QML-only directive) which Node.js
        # cannot parse, so strip .pragma lines into a temp file first.
        run: |
          for f in trackgen/*.js; do
            echo "Checking $f"
            tmp=$(mktemp --suffix=.js)
            sed '/^\.pragma /d' "$f" > "$tmp"
            node --check "$tmp" && RC=0 || RC=$?
            rm -f "$tmp"
            [ $RC -eq 0 ] || exit $RC
          done

      - name: Install qmllint
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends qt6-declarative-dev-tools

      - name: Check QML parse errors
        # Filter qmllint output to Error: lines only.
        # Warning:/Info: lines are all semantic false-positives caused by missing
        # QtQuick/MuseScore/FileIO types — none of those prevent the plugin loading.
        # A genuine parse error (e.g. unexpected token from curly quotes) appears
        # as an Error: line and causes qmllint to exit 1, which we surface here.
        run: |
          output=$(/usr/lib/qt6/bin/qmllint \
            --import disable \
            --unqualified disable \
            trackgen/trackgen.qml 2>&1 || true)
          parse_errors=$(printf '%s\n' "$output" | grep '^Error:' || true)
          if [ -n "$parse_errors" ]; then
            printf '%s\n' "$output"
            exit 1
          fi
